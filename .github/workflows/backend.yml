# 01-umumiy.md, 4-bo'lim va 02-backend.md, 9-bo'lim: har PR'da SAST, SCA, secret-scan,
# konteyner skaneri. Birortasi qizil bo'lsa merge qilinmaydi (branch protection'da majburiy).
name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint + SAST (ruff, flake8-bandit qoidalari)
        run: uv run ruff check .
      - name: Tiplar
        run: uv run mypy app
      - name: SAST (bandit, Medium+)
        run: uv run bandit -r app -c pyproject.toml -ll
      - name: Testlar (IDOR, OTP limitlari, refresh reuse, idempotency, withdraw > saved)
        run: uv run pytest -q
      - name: Migratsiyalar modelga mos
        env:
          FINORA_MIGRATIONS_DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: uv run alembic upgrade head && uv run alembic check

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bog'liqliklar zaifliklari (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes -o requirements.txt
          uvx pip-audit -r requirements.txt --strict

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finora-backend:ci .
      - name: Konteyner skaneri (Critical/High bo'lsa reliz yo'q)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finora-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
