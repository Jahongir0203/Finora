[project]
name = "finora-backend"
version = "0.1.0"
description = "Finora — shaxsiy moliya ilovasi backend (FastAPI, Clean Architecture)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    # PYSEC-2026-3552/3553/3554 49-50 da yopilgan. Intel Mac uchun 49+ wheel yo'q —
    # u yerda faqat lokal dev (prod/CI Linux'da doim tuzatilgan versiya)
    "cryptography>=50.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography>=43.0,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "starlette>=1.7.0",
    "pillow>=11",
    "pillow-heif>=0.18",
    "httpx[http2]>=0.27",
    "boto3>=1.35",
    "prometheus-client>=0.21",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "boto3-stubs[s3]>=1.35",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
package = false
# Intel Mac uchun tayyor wheel bo'lgan versiya tanlansin (Rust build talab qilinmasin)
no-build-package = ["cryptography"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic avtogeneratsiya qilgan fayllar
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Lokalizatsiya matnlari (kirill, o'zbek apostrofi) — ataylab
"app/core/i18n.py" = ["RUF001"]
"app/seed.py" = ["RUF001", "T201"]
"app/infrastructure/reports/renderers.py" = ["RUF001"]
"app/application/insights/use_cases.py" = ["RUF001"]
"app/application/receipts/parsing.py" = ["RUF001"]
# Testlarda sinxron fayl tekshiruvlari (tmp_path) muammo emas
"tests/**" = ["S105", "S106", "ASYNC240", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
